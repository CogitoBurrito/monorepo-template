name: Deploy turborepo-remote-cache

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "packages/turborepo-remote-cache/**"
      - ".github/workflows/deploy-turborepo-remote-cache.yml"

concurrency:
  group: deploy-turborepo-remote-cache
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy Worker
    runs-on: ubuntu-slim
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/setup@v2.1
        with:
          require-lockfile: true
          cache: true

      - name: Lint, type-check & test
        run: pnpm exec turbo run lint check-types test --filter=@jonsun/turborepo-remote-cache

      - name: Build
        run: pnpm exec turbo run build --filter=@jonsun/turborepo-remote-cache

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/turborepo-remote-cache
          command: deploy
