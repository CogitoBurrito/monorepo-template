# yaml-language-server: $schema=https://json.schemastore.org/lefthook.json

pre-commit:
  commands:
    preflight:
      run: pnpm preflight
      glob: "*.{js,ts,jsx,tsx,json,yaml,yml,md,css,scss}"
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
      skip:
        - merge
        - rebase

pre-push:
  commands:
    preflight:
      run: pnpm preflight
