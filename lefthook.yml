# yaml-language-server: $schema=https://json.schemastore.org/lefthook.json

pre-commit:
  commands:
    format:
      run: pnpm exec prettier --write --list-different {staged_files}
      glob: "*.{js,ts,jsx,tsx,json,yaml,yml,md,css,scss}"
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
      skip:
        - merge
        - rebase

pre-push:
  commands:
    check-types:
      run: pnpm turbo run check-types
    lint:
      run: pnpm turbo run lint
